[project]
name = "vastai-mcp"
version = "0.2.0"
description = "Codex MCP tools for the Vast.ai GPU marketplace and Python SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "mcp>=1.24,<2",
    "uvicorn>=0.35,<1",
    "vastai==1.12.0",
]

[project.urls]
Repository = "https://github.com/candacelabs/vastai-mcp"
Issues = "https://github.com/candacelabs/vastai-mcp/issues"

[project.scripts]
vastai-mcp = "vastai_mcp.server:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vastai_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"VAST-LICENSE.txt" = "vastai_mcp/VAST-LICENSE.txt"

[dependency-groups]
test = [
    "pytest>=8,<10",
]
